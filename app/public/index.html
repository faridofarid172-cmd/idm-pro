<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Internet Download Manager</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%233aa03a'/%3E%3Cpath d='M16 7v11M10 15l6 7 6-7' stroke='white' stroke-width='4' fill='none'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="/css/app.css?v=6.43.16" />
  </head>
  <body>
    <div id="app" class="window hidden">
      <div class="titlebar" id="titlebar">
        <div class="title-left">
          <span class="title-icon" id="title-icon"></span>
          <span class="title-text" id="title-text">Internet Download Manager</span>
        </div>
        <div class="window-controls">
          <button class="win-btn" id="btn-minimize" title="Minimize">
            <svg viewBox="0 0 12 12"><path d="M2 9h8" stroke="currentColor" stroke-width="1.4" /></svg>
          </button>
          <button class="win-btn" id="btn-maximize" title="Maximize">
            <svg viewBox="0 0 12 12"><rect x="2.5" y="2.5" width="7" height="7" fill="none" stroke="currentColor" stroke-width="1.3" /></svg>
          </button>
          <button class="win-btn close" id="btn-close" title="Close">
            <svg viewBox="0 0 12 12"><path d="M3 3l6 6M9 3l-6 6" stroke="currentColor" stroke-width="1.4" /></svg>
          </button>
        </div>
      </div>

      <div class="menubar" id="menubar"></div>
      <div class="toolbar" id="toolbar"></div>

      <div class="workspace">
        <aside class="tree-panel" id="tree-panel">
          <div class="panel-head">
            <span class="panel-title">Categories</span>
            <button class="panel-close" id="hide-categories" title="Hide Categories">✕</button>
          </div>
          <div class="tree" id="tree"></div>
        </aside>
        <div class="splitter" id="splitter"></div>
        <section class="list-panel">
          <div class="list-head" id="list-head"></div>
          <div class="list-body" id="list-body">
            <div class="empty-state" id="empty-state">
              <div id="empty-icon"></div>
              <div id="empty-text">No downloads are in this category.</div>
            </div>
          </div>
        </section>
      </div>

      <div class="statusbar" id="statusbar">
        <span id="status-main">Ready</span>
        <span class="sep optional"></span>
        <span id="status-selected" class="optional">0 selected</span>
        <span class="grow"></span>
        <span class="speed" id="status-speed"></span>
        <span class="sep optional"></span>
        <span id="status-queue" class="optional">Queue: stopped</span>
        <span class="sep optional"></span>
        <span id="status-conn" title="Service connection" class="optional">Offline</span>
        <canvas class="mini-graph" id="mini-graph" width="144" height="30"></canvas>
      </div>
    </div>

    <div id="dialog-layer"></div>
    <div id="toast-layer"></div>

    <script src="/js/icons.js?v=6.43.16"></script>
    <script src="/js/format.js?v=6.43.16"></script>
    <script src="/js/api.js?v=6.43.16"></script>
    <script src="/js/ui.js?v=6.43.16"></script>
    <script src="/js/app.js?v=6.43.16"></script>
    <script src="/js/dlg-file.js?v=6.43.16"></script>
    <script src="/js/dlg-options.js?v=6.43.16"></script>
    <script src="/js/dlg-scheduler.js?v=6.43.16"></script>
    <script src="/js/dlg-grabber.js?v=6.43.16"></script>
    <script src="/js/dlg-misc.js?v=6.43.16"></script>
    <script src="/js/setup.js?v=6.43.16"></script>
    <script src="/js/main.js?v=6.43.16"></script>
  </body>
</html>
